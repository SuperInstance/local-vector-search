[package]
name = "local-vector-search"
version = "0.1.0"
edition = "2021"
description = "Local TF-IDF vector search engine for repo discovery"
license = "MIT"

[[bin]]
name = "lvs"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
rayon = "1"
walkdir = "2"
rust-stemmers = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
